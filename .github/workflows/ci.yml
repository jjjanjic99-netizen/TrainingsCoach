name: CI

# Läuft bei jedem Push (alle Branches) und bei Pull Requests.
# Prüft Lint, Typen, Unit-Tests und den Produktions-Build.
on:
  push:
    branches:
      - "**"
  pull_request:

# Ältere Läufe desselben Refs abbrechen, sobald ein neuer startet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        run: npm run test

      - name: Build
        run: npm run build
